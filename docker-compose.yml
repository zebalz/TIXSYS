# The whole help desk in one bundle: the app, its database, the web server
# (Caddy, which also handles HTTPS), and the nightly backup.
# Settings come from the .env file. Use ./tixsys instead of running this directly.
#
# Locked down on purpose:
# - Only Caddy is reachable from outside (ports 80 and 443). The app and the
#   database have no published ports; they only talk to each other.
# - No container can gain extra privileges after it starts (no-new-privileges).
# - The app runs as a normal user, with every Linux capability removed and a
#   read-only file system (it can write only uploads and temporary files).

name: tixsys

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tixsys
      POSTGRES_USER: tixsys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./tixsys setup first}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixsys -d tixsys"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: tixsys
      POSTGRES_USER: tixsys
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TIXSYS_DOMAIN: ${TIXSYS_DOMAIN:?Run ./tixsys setup first}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    environment:
      PGHOST: db
      PGDATABASE: tixsys
      PGUSER: tixsys
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-10:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./docker/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
      - media:/data/media:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  media:
  caddy_data:
  caddy_config:
