{% load static desk %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}{{ org.portal_title }}{% endblock %} — {{ org.name }}</title>
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'css/tixsys.css' %}">
<style>:root{--brand:{{ org.brand_color|default:'#26232F' }};--brand-ink:{{ org.brand_color|default:'#26232F'|readable_on }};--accent:{{ org.header_color|default:'#CFC6FF' }};}</style>
<script src="{% static 'js/boot.js' %}"></script>
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<a class="skip" href="#main">Skip to content</a>
{% include "partials/icons.html" %}
{% block body %}{% endblock %}
</body>
</html>
